<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #6B8E5F 0%, #8A9A7B 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }
  .check {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6B8E5F 0%, #8A9A7B 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    animation: pop 0.5s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .check svg { width: 42px; height: 42px; }
  h1 { font-size: 26px; color: #2C3E2A; margin-bottom: 8px; }
  .subtitle { color: #6B7864; font-size: 15px; margin-bottom: 32px; }
  .receipt {
    background: #F5F7F3;
    border-radius: 12px;
    padding: 20px 24px;
    text-align: left;
    margin-bottom: 28px;
  }
  .receipt-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 14px;
  }
  .receipt-row + .receipt-row { border-top: 1px solid #E8EDE3; }
  .receipt-label { color: #6B7864; }
  .receipt-value { color: #2C3E2A; font-weight: 600; }
  .receipt-value.txn {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #6B8E5F;
  }
  .badge {
    display: inline-block;
    background: #E8EDE3;
    color: #6B8E5F;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6B8E5F 0%, #8A9A7B 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.1s;
  }
  .btn:hover { transform: translateY(-1px); }
  .note { margin-top: 16px; font-size: 13px; color: #999; }
</style>
</head>
<body>

<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" 
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <h1>Payment Successful</h1>
  <p class="subtitle">Your membership is now active 🎉</p>

  <div class="receipt">
    <div class="receipt-row">
      <span class="receipt-label">Status</span>
      <span class="badge">CONFIRMED</span>
    </div>
    <div class="receipt-row">
      <span class="receipt-label">Amount Paid</span>
      <span class="receipt-value">NPR {{ amount }}.00</span>
    </div>
    <div class="receipt-row">
      <span class="receipt-label">Transaction ID</span>
      <span class="receipt-value txn">{{ txn_id }}</span>
    </div>
    <div class="receipt-row">
      <span class="receipt-label">Payment Type</span>
      <span class="receipt-value">One-time membership</span>
    </div>
  </div>

  <a href="/" class="btn">Continue to Login →</a>
  <p class="note">You can now log in with the email and password you registered.</p>
</div>

</body>
